<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Details Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #dfe9ff);
            color: #1f2937;
        }

        .container {
            width: min(90%, 520px);
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(37, 99, 235, 0.15);
            padding: 32px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            text-align: center;
            color: #1d4ed8;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 24px;
            color: #4b5563;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        button {
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 18px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        .message {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 10px;
            background: #ecfdf5;
            color: #065f47;
            border: 1px solid #a7f3d0;
            display: none;
            font-weight: 600;
        }

        .message.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Personal Details</h2>
        <p class="subtitle">Fill in your information below:</p>

        <form id="detailsForm">
            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="field">
                <label for="gmail">Gmail</label>
                <input type="email" id="gmail" name="gmail" placeholder="Enter your email" required>
            </div>

            <section>
                <h2>Academic Details</h2>

                <label for="gpa">GPA:</label>
                <input type="number" id="gpa" name="gpa" min="0" max="10" step="0.01" required>

                <br><br>

                <label for="passing-year">Year of Passing:</label>
                <input type="number" id="passing-year" name="passing-year"
                    min="2000" max="2031" required>

                <br><br>

            </section>

            <button type="submit">Submit</button>
        </form>

        <div id="successMessage" class="message" aria-live="polite"></div>
    </div>
</body>
</html>
